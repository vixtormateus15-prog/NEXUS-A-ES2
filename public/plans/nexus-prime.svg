<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="NEXUS PRIME: arte gráfica ilustrativa temática">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset=".52" stop-color="#241303"/><stop offset="1" stop-color="#9b5b0b"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#ffe7a0" stop-opacity=".5"/><stop offset="1" stop-color="#ffe7a0" stop-opacity="0"/></radialGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".28" stop-color="#ffe7a0"/><stop offset=".62" stop-color="#9b5b0b"/><stop offset="1" stop-color="#fff"/></linearGradient>
 <linearGradient id="shine"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".48" stop-color="#fff" stop-opacity=".42"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#ffe7a0" stroke-opacity=".13" stroke-width="1"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
 .orbit{transform-origin:840px 240px;animation:spin 24s linear infinite}
 .float{animation:float 5s ease-in-out infinite}
 .pulse{transform-origin:840px 240px;animation:pulse 3.8s ease-in-out infinite}
 .sweep{animation:sweep 6s ease-in-out infinite}
 .spark{animation:spark 3s ease-in-out infinite alternate}
 @keyframes spin{to{transform:rotate(360deg)}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
 @keyframes pulse{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
 @keyframes sweep{0%{transform:translateX(-420px);opacity:0}20%{opacity:.6}70%{opacity:.35}100%{transform:translateX(1450px);opacity:0}}
 @keyframes spark{from{opacity:.25}to{opacity:1}}
 @media(prefers-reduced-motion:reduce){.orbit,.float,.pulse,.sweep,.spark{animation:none}}
</style>
<rect width="1200" height="480" fill="url(#bg)"/>
<rect width="1200" height="480" fill="url(#grid)"/>
<circle cx="840" cy="240" r="280" fill="url(#halo)" class="pulse"/>
<path d="M0 390Q260 300 520 385T1200 330V480H0Z" fill="#9b5b0b" opacity=".15"/>
<g fill="none" stroke="#ffe7a0" stroke-opacity=".25"><circle cx="840" cy="240" r="190" stroke-width="2"/><circle cx="840" cy="240" r="225" stroke-width="1" stroke-dasharray="3 14"/></g>
<g class="orbit" fill="none" stroke="#ffe7a0" stroke-width="3" stroke-opacity=".55"><ellipse cx="840" cy="240" rx="245" ry="95" transform="rotate(-28 840 240)"/><circle cx="1082" cy="150" r="8" fill="#fff" filter="url(#glow)"/></g>
<g class="float" filter="url(#glow)"><g transform="translate(840 240)"><path d="M-150-75L-70-5 0-135 70-5 150-75 120 105H-120Z" fill="url(#metal)" fill-opacity=".3" stroke="#fff0bd" stroke-width="6" stroke-linejoin="round"/><path d="M-120 65H120M-105 105H105" stroke="#ffe7a0" stroke-width="6" stroke-linecap="round"/><path d="M-150-75L-120 105M150-75L120 105M0-135V-170" stroke="#fff5d7" stroke-width="4"/><circle cx="0" cy="-135" r="13" fill="#fff7d7"/><circle cx="-150" cy="-75" r="10" fill="#fff7d7"/><circle cx="150" cy="-75" r="10" fill="#fff7d7"/><circle r="190" fill="none" stroke="#ffdb83" stroke-opacity=".55" stroke-width="3" stroke-dasharray="5 15"/></g></g>
<g class="spark" fill="#fff"><circle cx="680" cy="95" r="4"/><circle cx="1030" cy="350" r="5"/><circle cx="730" cy="390" r="3"/><circle cx="1090" cy="80" r="3"/></g>
<g opacity=".92"><text x="78" y="178" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="7">NEXUS AÇÕES</text><text x="75" y="252" fill="#fff" font-family="Arial,sans-serif" font-size="54" font-weight="800" letter-spacing="1">NEXUS PRIME</text><rect x="78" y="278" width="220" height="4" rx="2" fill="#ffe7a0"/><text x="78" y="326" fill="#ffe7a0" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4">EXCLUSIVIDADE PREMIUM</text><text x="78" y="370" fill="#dbeafe" opacity=".78" font-family="Arial,sans-serif" font-size="16" letter-spacing="2">VISUAL ILUSTRATIVO DO SEGMENTO</text></g>
<rect class="sweep" x="-300" y="0" width="180" height="480" fill="url(#shine)" transform="skewX(-18)"/>
<path d="M0 1H1200V479H0Z" fill="none" stroke="#ffe7a0" stroke-opacity=".35" stroke-width="2"/>
</svg>