<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="NEXUS ENERGY: arte gráfica ilustrativa temática">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset=".52" stop-color="#341207"/><stop offset="1" stop-color="#bd4a08"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#ffe36a" stop-opacity=".5"/><stop offset="1" stop-color="#ffe36a" stop-opacity="0"/></radialGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".28" stop-color="#ffe36a"/><stop offset=".62" stop-color="#bd4a08"/><stop offset="1" stop-color="#fff"/></linearGradient>
 <linearGradient id="shine"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".48" stop-color="#fff" stop-opacity=".42"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#ffe36a" stroke-opacity=".13" stroke-width="1"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
 .orbit{transform-origin:840px 240px;animation:spin 24s linear infinite}
 .float{animation:float 5s ease-in-out infinite}
 .pulse{transform-origin:840px 240px;animation:pulse 3.8s ease-in-out infinite}
 .sweep{animation:sweep 6s ease-in-out infinite}
 .spark{animation:spark 3s ease-in-out infinite alternate}
 @keyframes spin{to{transform:rotate(360deg)}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
 @keyframes pulse{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
 @keyframes sweep{0%{transform:translateX(-420px);opacity:0}20%{opacity:.6}70%{opacity:.35}100%{transform:translateX(1450px);opacity:0}}
 @keyframes spark{from{opacity:.25}to{opacity:1}}
 @media(prefers-reduced-motion:reduce){.orbit,.float,.pulse,.sweep,.spark{animation:none}}
</style>
<rect width="1200" height="480" fill="url(#bg)"/>
<rect width="1200" height="480" fill="url(#grid)"/>
<circle cx="840" cy="240" r="280" fill="url(#halo)" class="pulse"/>
<path d="M0 390Q260 300 520 385T1200 330V480H0Z" fill="#bd4a08" opacity=".15"/>
<g fill="none" stroke="#ffe36a" stroke-opacity=".25"><circle cx="840" cy="240" r="190" stroke-width="2"/><circle cx="840" cy="240" r="225" stroke-width="1" stroke-dasharray="3 14"/></g>
<g class="orbit" fill="none" stroke="#ffe36a" stroke-width="3" stroke-opacity=".55"><ellipse cx="840" cy="240" rx="245" ry="95" transform="rotate(-28 840 240)"/><circle cx="1082" cy="150" r="8" fill="#fff" filter="url(#glow)"/></g>
<g class="float" filter="url(#glow)"><g transform="translate(840 240)"><circle r="105" fill="url(#metal)" fill-opacity=".25" stroke="#fff0a6" stroke-width="5"/><circle r="70" fill="none" stroke="#ffe36a" stroke-width="5" stroke-dasharray="12 12"/><path d="M20-130L-65 15H-5L-35 135 75-25H12Z" fill="#fff3a8" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><g stroke="#ffcf57" stroke-width="7" stroke-linecap="round"><path d="M0-175V-205M0 175V205M175 0H205M-175 0H-205M124-124L146-146M-124 124L-146 146M124 124L146 146M-124-124L-146-146"/></g></g></g>
<g class="spark" fill="#fff"><circle cx="680" cy="95" r="4"/><circle cx="1030" cy="350" r="5"/><circle cx="730" cy="390" r="3"/><circle cx="1090" cy="80" r="3"/></g>
<g opacity=".92"><text x="78" y="178" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="7">NEXUS AÇÕES</text><text x="75" y="252" fill="#fff" font-family="Arial,sans-serif" font-size="54" font-weight="800" letter-spacing="1">NEXUS ENERGY</text><rect x="78" y="278" width="220" height="4" rx="2" fill="#ffe36a"/><text x="78" y="326" fill="#ffe36a" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4">ENERGIA DO FUTURO</text><text x="78" y="370" fill="#dbeafe" opacity=".78" font-family="Arial,sans-serif" font-size="16" letter-spacing="2">VISUAL ILUSTRATIVO DO SEGMENTO</text></g>
<rect class="sweep" x="-300" y="0" width="180" height="480" fill="url(#shine)" transform="skewX(-18)"/>
<path d="M0 1H1200V479H0Z" fill="none" stroke="#ffe36a" stroke-opacity=".35" stroke-width="2"/>
</svg>